<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffdf8" surfaceScale="1" result="light">
        <feDistantLight azimuth="45" elevation="60" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
  </defs>

  <!-- Newspaper / Notice Background -->
  <rect width="600" height="750" fill="#fcf9f2" stroke="#d4cbba" stroke-width="3" />
  
  <!-- Outer Double Border typical of official newspaper notices -->
  <rect x="15" y="15" width="570" height="720" fill="none" stroke="#222" stroke-width="2" />
  <rect x="19" y="19" width="562" height="712" fill="none" stroke="#444" stroke-width="0.8" />

  <!-- Newspaper Clipping Header -->
  <rect x="20" y="20" width="560" height="35" fill="#f0ebe0" />
  <text x="30" y="42" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#555" letter-spacing="1">रोजगार समाचार / दैनिक भास्कर (ग्वालियर संस्करण)</text>
  <text x="480" y="42" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#777">पृष्ठ सं. 14</text>
  <line x1="20" y1="55" x2="580" y2="55" stroke="#222" stroke-width="1.5" />

  <!-- Organization Header -->
  <text x="300" y="90" font-family="'Times New Roman', serif" font-size="22" font-weight="900" fill="#003366" text-anchor="middle" letter-spacing="0.5">CENTRAL BANK OF INDIA</text>
  <text x="300" y="112" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">REGIONAL OFFICE: GWALIOR (M.P.)</text>
  <text x="300" y="130" font-family="'Times New Roman', serif" font-size="11" fill="#666" text-anchor="middle">Naya Bazar, Lashkar, Gwalior (M.P.) - 474009</text>

  <line x1="35" y1="140" x2="565" y2="140" stroke="#003366" stroke-width="2" />
  
  <!-- Headline Banner -->
  <rect x="35" y="148" width="530" height="32" fill="#003366" />
  <text x="300" y="170" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">RECRUITMENT ON CONTRACT BASIS FOR RSETI &amp; FLCC (2026)</text>

  <!-- Notice Body -->
  <text x="40" y="202" font-family="'Times New Roman', serif" font-size="12" fill="#111" line-height="1.4">
    Applications in the prescribed physical format are invited from eligible Indian citizens for engagement
  </text>
  <text x="40" y="218" font-family="'Times New Roman', serif" font-size="12" fill="#111">
    to the following contractual posts under Regional Office Gwalior:
  </text>

  <!-- Vacancy Table -->
  <rect x="35" y="235" width="530" height="150" fill="#fff" stroke="#333" stroke-width="1" />
  <line x1="35" y1="265" x2="565" y2="265" stroke="#333" stroke-width="1.5" />
  <rect x="35" y="235" width="530" height="30" fill="#e8edf2" />

  <!-- Table Columns -->
  <line x1="85" y1="235" x2="85" y2="385" stroke="#333" stroke-width="1" />
  <line x1="280" y1="235" x2="280" y2="385" stroke="#333" stroke-width="1" />
  <line x1="380" y1="235" x2="380" y2="385" stroke="#333" stroke-width="1" />
  <line x1="470" y1="235" x2="470" y2="385" stroke="#333" stroke-width="1" />

  <!-- Table Headers -->
  <text x="60" y="255" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">S.No.</text>
  <text x="180" y="255" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Name of the Post</text>
  <text x="330" y="255" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Qualification</text>
  <text x="425" y="255" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Age Limit</text>
  <text x="517" y="255" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" text-anchor="middle">Honorarium</text>

  <!-- Row 1 -->
  <text x="60" y="290" font-family="'Times New Roman', serif" font-size="11" text-anchor="middle">01.</text>
  <text x="95" y="290" font-family="'Times New Roman', serif" font-size="11" font-weight="bold">Office Assistant</text>
  <text x="290" y="290" font-family="'Times New Roman', serif" font-size="10.5">Graduate (BSW/BA/B.Com)</text>
  <text x="425" y="290" font-family="'Times New Roman', serif" font-size="11" text-anchor="middle">22–40 Yrs</text>
  <text x="517" y="290" font-family="'Times New Roman', serif" font-size="11" text-anchor="middle">₹15,000/-</text>
  <line x1="35" y1="305" x2="565" y2="305" stroke="#ddd" stroke-width="1" />

  <!-- Row 2 -->
  <text x="60" y="330" font-family="'Times New Roman', serif" font-size="11" text-anchor="middle">02.</text>
  <text x="95" y="330" font-family="'Times New Roman', serif" font-size="11" font-weight="bold">Attender (Sub-Staff)</text>
  <text x="290" y="330" font-family="'Times New Roman', serif" font-size="10.5">10th Matriculation Pass</text>
  <text x="425" y="330" font-family="'Times New Roman', serif" font-size="11" text-anchor="middle">22–40 Yrs</text>
  <text x="517" y="330" font-family="'Times New Roman', serif" font-size="11" text-anchor="middle">₹10,000/-</text>
  <line x1="35" y1="345" x2="565" y2="345" stroke="#ddd" stroke-width="1" />

  <!-- Row 3 -->
  <text x="60" y="370" font-family="'Times New Roman', serif" font-size="11" text-anchor="middle">03.</text>
  <text x="95" y="370" font-family="'Times New Roman', serif" font-size="11" font-weight="bold">Watchman / Gardener</text>
  <text x="290" y="370" font-family="'Times New Roman', serif" font-size="10.5">8th / 7th Pass</text>
  <text x="425" y="370" font-family="'Times New Roman', serif" font-size="11" text-anchor="middle">22–40 Yrs</text>
  <text x="517" y="370" font-family="'Times New Roman', serif" font-size="11" text-anchor="middle">₹8,000/-</text>

  <!-- How to Apply Box -->
  <rect x="35" y="405" width="530" height="235" fill="#fefdf9" stroke="#999" stroke-dasharray="4,2" />
  <text x="50" y="428" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#003366">INSTRUCTIONS FOR OFFLINE / POSTAL SUBMISSION:</text>
  
  <text x="50" y="450" font-family="'Times New Roman', serif" font-size="11" fill="#222">1. The application must be submitted strictly in the prescribed proforma on A4 size paper.</text>
  <text x="50" y="470" font-family="'Times New Roman', serif" font-size="11" fill="#222">2. Affix one recent passport-sized color photograph with self-attestation.</text>
  <text x="50" y="490" font-family="'Times New Roman', serif" font-size="11" fill="#222">3. Enclose self-attested photocopies of birth proof, educational certificates &amp; Aadhaar.</text>
  <text x="50" y="510" font-family="'Times New Roman', serif" font-size="11" fill="#222">4. Envelope must be super-scribed: <tspan font-weight="bold">"APPLICATION FOR THE POST OF [POST NAME]"</tspan></text>
  <text x="50" y="535" font-family="'Times New Roman', serif" font-size="11" fill="#c00" font-weight="bold">LAST DATE FOR RECEIPT OF APPLICATION: 28-11-2026 (UP TO 5:00 PM)</text>

  <!-- Postal Address Highlight -->
  <rect x="50" y="550" width="500" height="75" fill="#f0f4f8" stroke="#003366" stroke-width="1" />
  <text x="65" y="570" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#003366">Address for dispatch via Speed Post / Registered Post:</text>
  <text x="65" y="590" font-family="'Times New Roman', serif" font-size="11" fill="#222">The Regional Head / Co-Chairman (DLRAC), Central Bank of India,</text>
  <text x="65" y="608" font-family="'Times New Roman', serif" font-size="11" fill="#222">Regional Office Gwalior, Naya Bazar, Lashkar, Gwalior (M.P.) - 474009</text>

  <!-- Official Stamp / Seal Emblem Graphic -->
  <circle cx="515" cy="690" r="32" fill="none" stroke="#003366" stroke-width="2" stroke-dasharray="3,2" />
  <circle cx="515" cy="690" r="26" fill="none" stroke="#003366" stroke-width="1" />
  <text x="515" y="688" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#003366" text-anchor="middle">REGIONAL OFFICE</text>
  <text x="515" y="698" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#003366" text-anchor="middle">GWALIOR (M.P.)</text>

  <text x="40" y="695" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#444">Official Recruitment Notice Ref: RO/GWL/REC/2026/08</text>
  <text x="40" y="712" font-family="'Times New Roman', serif" font-size="10" fill="#777">Prescribed format available for instant download at Patidar Online Center</text>
</svg>
